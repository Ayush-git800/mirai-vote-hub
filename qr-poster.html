<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mirai Vote Hub — Official QR Poster Generator</title>
  <link rel="icon" type="image/png" href="assets/mirai-logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600;700&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- QRCode.js and html2canvas via CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

  <style>
    :root {
      --bg-page: #060913;
      --card-bg: linear-gradient(145deg, #070B19 0%, #0F172A 55%, #091326 100%);
      --accent-cyan: #00f0ff;
      --accent-blue: #3b82f6;
      --accent-gold: #f59e0b;
      --accent-emerald: #10b981;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-page);
      background-image: 
        radial-gradient(circle at 20% 20%, rgba(0, 240, 255, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 80% 80%, rgba(245, 158, 11, 0.06) 0%, transparent 40%);
      color: var(--text-main);
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    /* Actions Bar above/below */
    .controls-panel {
      display: flex;
      gap: 16px;
      align-items: center;
      margin-top: 30px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .btn-download {
      background: linear-gradient(135deg, #00f0ff 0%, #0284c7 100%);
      color: #040914;
      font-family: 'Outfit', sans-serif;
      font-size: 1.05rem;
      font-weight: 800;
      letter-spacing: 0.02em;
      padding: 14px 32px;
      border: none;
      border-radius: 9999px;
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(0, 240, 255, 0.35);
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }

    .btn-download:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 40px rgba(0, 240, 255, 0.5);
      background: linear-gradient(135deg, #38bdf8 0%, #0369a1 100%);
    }

    .btn-download:active {
      transform: translateY(0);
    }

    .btn-portal {
      background: rgba(15, 23, 42, 0.8);
      color: #38bdf8;
      font-family: 'Outfit', sans-serif;
      font-size: 0.95rem;
      font-weight: 600;
      padding: 13px 26px;
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 9999px;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn-portal:hover {
      background: rgba(56, 189, 248, 0.15);
      border-color: #38bdf8;
      color: #fff;
    }

    /* ==========================================================================
       POSTER CARD (Strict 600px x 840px for high-res 1800x2520 capture)
       ========================================================================== */
    #posterCard {
      width: 600px;
      height: 840px;
      background: var(--card-bg);
      border: 2px solid rgba(0, 240, 255, 0.35);
      border-radius: 28px;
      position: relative;
      overflow: hidden;
      padding: 40px 36px 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      box-shadow: 
        0 25px 60px rgba(0, 0, 0, 0.7),
        0 0 40px rgba(0, 240, 255, 0.15),
        inset 0 0 30px rgba(0, 240, 255, 0.04);
    }

    /* Ambient background accents inside poster */
    #posterCard::before {
      content: '';
      position: absolute;
      top: -100px;
      left: 50%;
      transform: translateX(-50%);
      width: 450px;
      height: 250px;
      background: radial-gradient(ellipse at center, rgba(0, 240, 255, 0.18) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    #posterCard::after {
      content: '';
      position: absolute;
      bottom: -60px;
      left: 50%;
      transform: translateX(-50%);
      width: 400px;
      height: 200px;
      background: radial-gradient(ellipse at center, rgba(245, 158, 11, 0.12) 0%, transparent 70%);
      pointer-events: none;
      z-index: 0;
    }

    .poster-inner {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
    }

    /* Header & Logo */
    .header-pill {
      background: rgba(255, 255, 255, 0.94);
      padding: 10px 24px;
      border-radius: 9999px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 12px;
    }

    .header-logo {
      height: 44px;
      width: auto;
      object-fit: contain;
      display: block;
    }

    /* Title Section */
    .title-section {
      text-align: center;
    }

    .main-title {
      font-size: 2.35rem;
      font-weight: 900;
      letter-spacing: 0.04em;
      line-height: 1.1;
      text-transform: uppercase;
      background: linear-gradient(135deg, #ffffff 15%, #00f0ff 65%, #38bdf8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 30px rgba(0, 240, 255, 0.35);
    }

    .sub-title {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.88rem;
      font-weight: 700;
      letter-spacing: 0.22em;
      color: #f59e0b;
      margin-top: 6px;
      text-transform: uppercase;
    }

    .department-badge {
      display: inline-block;
      font-size: 0.76rem;
      font-weight: 600;
      color: var(--text-muted);
      letter-spacing: 0.05em;
      margin-top: 4px;
    }

    /* Center QR Container Card */
    .qr-card-elevated {
      background: #ffffff;
      padding: 20px;
      border-radius: 24px;
      box-shadow: 
        0 20px 50px rgba(0, 240, 255, 0.28),
        0 0 0 1px rgba(255, 255, 255, 0.9);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    #qrcode {
      width: 250px;
      height: 250px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #qrcode img, #qrcode canvas {
      display: block;
      width: 250px !important;
      height: 250px !important;
      border-radius: 8px;
    }

    /* Call to Action */
    .cta-badge {
      background: linear-gradient(90deg, rgba(0, 240, 255, 0.15) 0%, rgba(59, 130, 246, 0.2) 100%);
      border: 1px solid rgba(0, 240, 255, 0.45);
      border-radius: 12px;
      padding: 10px 22px;
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 14px;
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.15);
    }

    .camera-icon {
      font-size: 1.15rem;
    }

    .cta-text {
      font-size: 0.86rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      color: #00f0ff;
      text-transform: uppercase;
    }

    /* URL Pill */
    .url-pill {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.85rem;
      font-weight: 700;
      color: #f8fafc;
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 7px 20px;
      border-radius: 9999px;
      margin-top: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .url-pill .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 8px #10b981;
      display: inline-block;
    }

    /* Footer Trust Strip */
    .footer-strip {
      width: 100%;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding-top: 14px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--text-muted);
      letter-spacing: 0.03em;
    }

    .footer-strip span {
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .footer-strip .sep {
      color: rgba(255, 255, 255, 0.25);
    }

    /* Download status indicator */
    #statusText {
      font-size: 0.88rem;
      color: var(--text-muted);
      margin-top: 10px;
      height: 20px;
      font-weight: 500;
    }
  </style>
</head>
<body>

  <!-- Printable 600px x 840px Canvas Container -->
  <div id="posterCard">
    <div class="poster-inner">
      
      <!-- Top Institutional Logo Pill -->
      <div class="header-pill">
        <img class="header-logo" src="assets/mirai-logo.png" alt="Mirai School of Technology">
      </div>

      <!-- Main Headline & Subtitle -->
      <div class="title-section">
        <h1 class="main-title">Mirai Vote Hub</h1>
        <div class="sub-title">Official Digital Election Portal</div>
        <div class="department-badge">Department of Computer Science &amp; Engineering (AI &amp; ML)</div>
      </div>

      <!-- Scannable High-Contrast QR Code Card -->
      <div class="qr-card-elevated">
        <div id="qrcode"></div>
      </div>

      <!-- Call to Action Banner -->
      <div class="cta-badge">
        <span class="camera-icon">📷</span>
        <span class="cta-text">Scan with Phone Camera to Cast Your Vote</span>
      </div>

      <!-- Direct URL Pill -->
      <div class="url-pill">
        <span class="dot"></span>
        <span>mirai-election-portal.web.app</span>
      </div>

      <!-- Bottom Security & Trust Strip -->
      <div class="footer-strip">
        <span>🔒 Roll-Number Verified</span>
        <span class="sep">•</span>
        <span>🛡️ Secret Ballot</span>
        <span class="sep">•</span>
        <span>⚡ Instant Audit</span>
      </div>

    </div>
  </div>

  <!-- Interactive Controls Outside the Poster -->
  <div class="controls-panel">
    <button id="downloadBtn" class="btn-download" type="button">
      <span>📥</span>
      <span>Download High-Res Poster (PNG)</span>
    </button>
    <a href="https://mirai-election-portal.web.app" target="_blank" rel="noopener noreferrer" class="btn-portal">
      <span>🌐</span>
      <span>Open Live Portal</span>
    </a>
  </div>
  <div id="statusText"></div>

  <script>
    const TARGET_URL = "https://mirai-election-portal.web.app";

    // 1. Generate High-Correction Scannable QR Code
    document.addEventListener("DOMContentLoaded", () => {
      const qrContainer = document.getElementById("qrcode");
      new QRCode(qrContainer, {
        text: TARGET_URL,
        width: 250,
        height: 250,
        colorDark: "#050811",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.H
      });
    });

    // 2. High-Res PNG Capture and Download via html2canvas (scale: 3 => 1800x2520)
    const downloadBtn = document.getElementById("downloadBtn");
    const statusText = document.getElementById("statusText");
    const posterCard = document.getElementById("posterCard");

    downloadBtn.addEventListener("click", async () => {
      try {
        downloadBtn.disabled = true;
        downloadBtn.style.opacity = "0.7";
        statusText.textContent = "Rendering 1800×2520 Ultra-HD Print Poster... Please wait.";

        const canvas = await html2canvas(posterCard, {
          scale: 3, // 600x840 -> 1800x2520 print quality
          useCORS: true,
          allowTaint: true,
          backgroundColor: null,
          logging: false
        });

        const imageUri = canvas.toDataURL("image/png");
        const downloadAnchor = document.createElement("a");
        downloadAnchor.download = "Mirai_Vote_Hub_QR_Poster.png";
        downloadAnchor.href = imageUri;
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        document.body.removeChild(downloadAnchor);

        statusText.textContent = "✓ Download complete! Poster ready for print & WhatsApp sharing.";
        setTimeout(() => { statusText.textContent = ""; }, 4000);
      } catch (err) {
        console.error("Poster render error:", err);
        statusText.textContent = "Render error: " + err.message;
      } finally {
        downloadBtn.disabled = false;
        downloadBtn.style.opacity = "1";
      }
    });
  </script>
</body>
</html>
